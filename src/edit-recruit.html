<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentCoPilot - Edit Recruit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-header-row">
    <h2>Edit Candidate: <span id="displayCandidateName">Loading...</span></h2>
    <a href="manage-recruits.html" class="btn btn-secondary">Back to Recruits List</a>
  </div>
  <form id="editRecruitForm">
    <input type="hidden" id="recruitId">
    <input type="hidden" id="applicationId">

    <!-- Section A: Personal & Contact -->
    <div class="section-card">
      <h3>A. Personal & Contact</h3>
      <div class="form-grid">
        <div>
          <label>Recruiter *</label>
          <select id="recruiterSelect" required><option value="">Loading recruiters...</option></select>
        </div>
        <div>
          <label>Date Sourced *</label>
          <input type="date" id="dateSourced" required onclick="this.showPicker()">
        </div>
        <div>
          <label>First Name *</label>
          <input type="text" id="firstName" required>
        </div>
        <div>
          <label>Surname *</label>
          <input type="text" id="surname" required>
        </div>
        <div>
          <label>Source *</label>
          <select id="sourceSelect" required><option value="">Loading sources...</option></select>
        </div>
        <div>
          <label>Notice Period *</label>
          <select id="noticePeriod" required>
            <option value="Immediately">Immediately</option>
            <option value="7 Days">7 Days</option>
            <option value="14 Days">14 Days</option>
            <option value="30 Days">30 Days</option>
            <option value="60 Days">60 Days</option>
            <option value="90 Days">90 Days</option>
          </select>
        </div>
        <div>
          <label>Email Address *</label>
          <input type="email" id="email" required>
        </div>
        <div>
          <label>Contact Number *</label>
          <input type="text" id="phone" required>
        </div>
        <div>
          <label>Country of Residence *</label>
          <select id="countrySelect" required onchange="handleCountryChange()">
            <option value="South Africa">South Africa</option>
            <option value="Zimbabwe">Zimbabwe</option>
            <option value="India">India</option>
          </select>
        </div>
        <div>
          <label>Current Location</label>
          <select id="locationSelect" name="currentLocation">
            <option value="">Select Location / City...</option>
          </select>
        </div>

        <!-- Current Rate Block -->
        <div class="full-width rate-card-block">
          <div class="rate-grid-row">
            <div>
              <label>Frequency</label>
              <input type="text" value="Monthly" readonly class="input-readonly">
            </div>
            <div>
              <label>Currency</label>
              <select id="currentCurrencySelect" onchange="calculateRateConversions()">
                <option value="ZAR">ZAR (R)</option>
                <option value="INR">INR (₹)</option>
                <option value="USD">USD ($)</option>
              </select>
            </div>
            <div>
              <label>Current Rate</label>
              <input type="number" id="currentRateInput" step="0.01" oninput="calculateRateConversions()">
            </div>
          </div>
          <div id="currentRateZarPreview" class="rate-preview-subtext"></div>
        </div>

        <!-- Expected Rate Block -->
        <div class="full-width rate-card-block">
          <div class="rate-grid-row">
            <div>
              <label>Frequency</label>
              <input type="text" value="Monthly" readonly class="input-readonly">
            </div>
            <div>
              <label>Currency *</label>
              <select id="expectedCurrencySelect" onchange="calculateRateConversions()">
                <option value="ZAR">ZAR (R)</option>
                <option value="INR">INR (₹)</option>
                <option value="USD">USD ($)</option>
              </select>
            </div>
            <div>
              <label>Expected Rate *</label>
              <input type="number" id="expectedRateInput" step="0.01" required oninput="calculateRateConversions()">
            </div>
          </div>
          <div id="expectedRateZarPreview" class="rate-preview-subtext highlight"></div>
        </div>

        <div>
          <label>Identification Type</label>
          <select id="idType">
            <option value="ID">ID</option>
            <option value="Passport">Passport</option>
          </select>
        </div>
        <div>
          <label>Identification Number</label>
          <input type="text" id="idNumber">
        </div>
      </div>
    </div>

    <!-- Section B: Role & Application -->
    <div class="section-card">
      <h3>B. Role & Application</h3>
      <div>
        <label>Role *</label>
        <select id="roleSelect" required><option value="">Select a Role...</option></select>
      </div>
    </div>

    <!-- Section C: Skills & Experience -->
    <div class="section-card">
      <h3>C. Skills & Experience</h3>
      <div class="form-grid mb-3">
        <div>
          <label>Current Role Title</label>
          <input type="text" id="currentRole" placeholder="e.g., Senior Full Stack Developer">
        </div>
        <div>
          <label>Role Classification</label>
          <select id="roleClassification">
            <option value="">Select Classification...</option>
            <option value="Software Engineering / Development">Software Engineering / Development</option>
            <option value="Data & Analytics">Data & Analytics</option>
            <option value="Cloud & Infrastructure">Cloud & Infrastructure</option>
            <option value="Project / Product Management">Project / Product Management</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Quality Assurance / Testing">Quality Assurance / Testing</option>
            <option value="UI/UX Design">UI/UX Design</option>
            <option value="Business Analysis">Business Analysis</option>
            <option value="Executive / Leadership">Executive / Leadership</option>
            <option value="Other / General Support">Other / General Support</option>
          </select>
        </div>
        <div>
          <label>Current Seniority Level</label>
          <select id="senioritySelect">
            <option value="">Select Seniority Level...</option>
            <option value="Junior">Junior</option>
            <option value="Mid-Level">Mid-Level</option>
            <option value="Senior">Senior</option>
            <option value="Lead / Executive">Lead / Executive</option>
          </select>
        </div>
        <div>
          <label>Total Years of Experience</label>
          <input type="number" step="0.5" id="totalExperience">
        </div>
        <div class="full-width">
          <label>Skills Held</label>
          <select id="skillSelect"><option value="">Select Skill to Add...</option></select>
          <div id="skillsContainer" class="tag-container"></div>
        </div>
        <div class="full-width">
          <label>Certifications Held</label>
          <select id="certSelect"><option value="">Select Certification to Add...</option></select>
          <div id="certsContainer" class="tag-container"></div>
        </div>
        <div class="full-width">
          <label>Other Skills / Certifications (Free Text)</label>
          <input type="text" id="otherSkills">
        </div>
      </div>
    </div>

    <!-- Section D: Recruitment Lifecycle -->
    <div class="section-card">
      <h3>D. Recruitment Lifecycle</h3>
      <div class="lifecycle-container" id="lifecycleContainer">
        <div class="lifecycle-item" data-stage="Sourced"><div class="stage-node"></div><span class="stage-label">Sourced</span></div>
        <div class="lifecycle-item" data-stage="In Discussion"><div class="stage-node"></div><span class="stage-label">In Discussion</span></div>
        <div class="lifecycle-item" data-stage="Screened"><div class="stage-node"></div><span class="stage-label">Screened</span></div>
        <div class="lifecycle-item" data-stage="CV Prepared"><div class="stage-node"></div><span class="stage-label">CV Prepared</span></div>
        <div class="lifecycle-item" data-stage="Interviewed"><div class="stage-node"></div><span class="stage-label">Interviewed</span></div>
        <div class="lifecycle-item" data-stage="Offer Sent"><div class="stage-node"></div><span class="stage-label">Offer Sent</span></div>
        <div class="lifecycle-item" data-stage="Hired"><div class="stage-node"></div><span class="stage-label">Hired</span></div>
      </div>
      <select id="lifecycleStage" name="lifecycleStage">
        <option value="Sourced">Sourced</option>
        <option value="In Discussion">In Discussion</option>
        <option value="Screened">Screened</option>
        <option value="CV Prepared">CV Prepared</option>
        <option value="Interviewed">Interviewed</option>
        <option value="Offer Sent">Offer Sent</option>
        <option value="Hired">Hired</option>
      </select>
    </div>

    <!-- Documents Section -->
    <div class="section-card">
      <h3>Candidate Documents</h3>
      <div class="form-grid">
        <div class="doc-item">
          <label for="fileCv">CV Document <span id="badgeCv" class="status-badge badge-pending">Pending</span></label>
          <input type="file" id="fileCv" accept=".pdf,.doc,.docx" class="file-input" />
        </div>
        <div class="doc-item">
          <label for="fileId">ID / Passport <span id="badgeId" class="status-badge badge-pending">Pending</span></label>
          <input type="file" id="fileId" accept=".pdf,.jpg,.png" class="file-input" />
        </div>
        <div class="doc-item">
          <label for="filePayslips">Pay Slips <span id="badgePayslips" class="status-badge badge-pending">Pending</span></label>
          <input type="file" id="filePayslips" accept=".pdf" class="file-input" />
        </div>
        <div class="doc-item">
          <label for="fileCerts">Certifications <span id="badgeCerts" class="status-badge badge-pending">Pending</span></label>
          <input type="file" id="fileCerts" accept=".pdf,.jpg,.png" class="file-input" />
        </div>
        <div class="doc-item">
          <label for="fileDegree">Degrees / Qualifications <span id="badgeDegree" class="status-badge badge-pending">Pending</span></label>
          <input type="file" id="fileDegree" accept=".pdf,.jpg,.png" class="file-input" />
        </div>
      </div>
    </div>

    <!-- Form Submit Action Bar -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" onclick="window.location.href='manage-recruits.html'">Cancel</button>
      <button type="submit" id="btnUpdateCandidate" class="btn btn-primary">Update Candidate</button>
    </div>
  </form>
  <script src="js/edit-recruit.js"></script>
</body>
</html>
