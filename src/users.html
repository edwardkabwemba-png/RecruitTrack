<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentCoPilot - Manage Users</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f4f6f8; color: #333; }
    .sidebar { width: 240px; background-color: #1e293b; color: #94a3b8; padding: 20px 0; }
    .brand { padding: 0 20px 20px; font-weight: bold; color: #fff; font-size: 1.2rem; }
    .brand span { display: block; font-size: 0.75rem; color: #64748b; font-weight: normal; }
    .nav-section { margin-top: 15px; }
    .nav-title { font-size: 0.65rem; text-transform: uppercase; color: #475569; padding: 0 20px 8px; font-weight: 700; }
    .nav-item { display: flex; padding: 10px 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    .nav-item.active { background-color: #334155; color: #fff; border-left: 4px solid #3b82f6; }
    .main-content { flex: 1; padding: 25px 35px; overflow-y: auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-primary { background-color: #1d4ed8; color: #fff; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; }
    
    .table-card { background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th { background: #f8fafc; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; color: #64748b; font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; }
    
    .avatar { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #3b82f6; color: white; font-weight: bold; font-size: 0.75rem; margin-right: 8px; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge-admin { background: #fee2e2; color: #991b1b; }
    .badge-recruiter { background: #dbeafe; color: #1e40af; }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 25px; border-radius: 8px; width: 400px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-secondary { background: #e2e8f0; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

   <aside class="sidebar">
    <div class="brand">TalentCoPilot <span>Recruitment Portal</span></div>
    <div class="nav-section">
      <div class="nav-title">MAIN</div>
      <a href="/dashboard.html" class="nav-item">Dashboard</a>
      <a href="#" class="nav-item">Add Recruit</a>
      <a href="/roles.html" class="nav-item">Manage Roles</a>
    </div>
    <div class="nav-section">
      <div class="nav-title">ADMIN</div>
      <a href="users.html" class="nav-item">Manage Users</a>
      <a href="positions.html" class="nav-item">Manage Positions</a>
      <a href="#" class="nav-item">Manage Sources</a>
      <a href="clients.html" class="nav-item">Manage Clients</a>
      <a href="skills.html" class="nav-item">Manage Skills</a>
      <a href="certifications.html" class="nav-item">Manage Certifications</a>
      <a href="#" class="nav-item">Settings</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div>
        <h2>Manage Users</h2>
        <p style="font-size: 0.8rem; color: #64748b;">Add and manage recruiter accounts</p>
      </div>
      <button class="btn-primary" onclick="openUserModal()">+ Add User</button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="users-table-body">
          <tr><td colspan="4" style="text-align: center;">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add User Modal -->
  <div class="modal" id="userModal">
    <div class="modal-content">
      <h3>Add New User</h3>
      <form id="addUserForm">
        <div class="form-group" style="margin-top: 15px;">
          <label>Full Name</label>
          <input type="text" id="fullName" required placeholder="e.g. Jane Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="jane.doe@company.com">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="userRole">
            <option value="Recruiter">Recruiter</option>
            <option value="Admin">Admin</option>
            <option value="Hiring Manager">Hiring Manager</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeUserModal()">Cancel</button>
          <button type="submit" class="btn-primary">Create User</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/users.js"></script>
</body>
</html>
