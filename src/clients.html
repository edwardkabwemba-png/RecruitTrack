<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentCoPilot - Manage Clients</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; min-height: 100vh; background-color: #f1f5f9; color: #334155; }
    .sidebar { width: 240px; background-color: #1e293b; color: #94a3b8; padding: 20px 0; display: flex; flex-direction: column; flex-shrink: 0; }
    .brand { padding: 0 20px 20px; font-weight: bold; color: #fff; font-size: 1.2rem; }
    .brand span { display: block; font-size: 0.75rem; color: #64748b; font-weight: normal; }
    .nav-section { margin-top: 15px; }
    .nav-title { font-size: 0.65rem; text-transform: uppercase; color: #475569; padding: 0 20px 8px; font-weight: 700; }
    .nav-item { display: flex; padding: 10px 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    .nav-item:hover, .nav-item.active { background-color: #334155; color: #fff; border-left: 4px solid #3b82f6; }
    .main-content { flex: 1; padding: 25px 35px; overflow-y: auto; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .table-card { background: #fff; border-radius: 8px; border: 1px solid #cbd5e1; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
    th { background-color: #f8fafc; color: #475569; font-weight: 600; }
    .btn-primary { background-color: #1d4ed8; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; border: none; cursor: pointer; text-decoration: none; }
    .btn-primary:disabled { background-color: #93c5fd; cursor: not-allowed; }
    .input-field { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; width: 100%; margin-bottom: 12px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal { background: white; padding: 24px; border-radius: 8px; width: 400px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">TalentCoPilot <span>Recruitment Portal</span></div>
    <div class="nav-section">
      <div class="nav-title">MAIN</div>
      <a href="dashboard.html" class="nav-item">Dashboard</a>
      <a href="manage-recruits.html" class="nav-item">Manage Recruit</a>
      <a href="roles.html" class="nav-item">Manage Roles</a>
    </div>
    <div class="nav-section">
      <div class="nav-title">ADMIN</div>
      <a href="users.html" class="nav-item">Manage Users</a>
      <a href="positions.html" class="nav-item">Manage Positions</a>
      <a href="sources.html" class="nav-item">Manage Sources</a>
      <a href="clients.html" class="nav-item active">Manage Clients</a>
      <a href="skills.html" class="nav-item">Manage Skills</a>
      <a href="certifications.html" class="nav-item">Manage Certifications</a>
      <a href="#" class="nav-item">Settings</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="header-row">
      <h2>Manage Clients</h2>
      <button class="btn-primary" onclick="openModal()">+ Add Client</button>
    </div>

    <div class="table-card">
      <input type="text" id="search" class="input-field" placeholder="Search clients or industries..." onkeyup="filterTable()">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Client Name</th>
            <th>Industry</th>
          </tr>
        </thead>
        <tbody id="clientTableBody"></tbody>
      </table>
    </div>
  </main>

  <div class="modal-overlay" id="modal" onclick="handleBackdropClick(event)">
    <div class="modal">
      <h3 style="margin-bottom:15px;">Add New Client</h3>
      <form id="addForm">
        <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px;">Client Name *</label>
        <input type="text" id="nameInput" class="input-field" required placeholder="e.g. Nexora Financial">
        
        <label style="font-size:0.8rem; font-weight:bold; display:block; margin-bottom:4px;">Industry</label>
        <input type="text" id="industryInput" class="input-field" placeholder="e.g. Banking & Finance">
        
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
          <button type="button" class="btn-primary" style="background:#cbd5e1; color:#334155;" onclick="closeModal()">Cancel</button>
          <button type="submit" id="saveBtn" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let list = [];

    function getStoredUserId() {
      const storedUser = JSON.parse(localStorage.getItem("user") || sessionStorage.getItem("user") || "{}");
      return storedUser.userId || storedUser.UserID || storedUser.id || '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const currentUserId = getStoredUserId();
      if (!currentUserId) {
        window.location.href = "index.html";
        return;
      }
      fetchClients();
    });

    async function fetchClients() {
      const tbody = document.getElementById('clientTableBody');
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#64748b; padding:20px;">Loading clients...</td></tr>`;

      try {
        const res = await fetch('/api/clients', {
          headers: { 'x-user-id': getStoredUserId() }
        });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem("user");
          sessionStorage.removeItem("user");
          window.location.href = "index.html";
          return;
        }

        if (!res.ok) {
          const rawText = await res.text();
          let errPayload = {};
          try { errPayload = JSON.parse(rawText); } catch (e) {}

          const errorMsg = errPayload.error || errPayload.message || (rawText.length < 100 ? rawText : res.statusText);
          console.error('API Error Response:', errorMsg);

          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ef4444; padding:20px;">
            Failed to load clients (${res.status}): ${errorMsg || 'Server error'}
          </td></tr>`;
          return;
        }

        list = await res.json();
        renderTable(list);
      } catch (err) {
        console.error('Network/Client Error:', err);
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ef4444; padding:20px;">
          Network error while connecting to server.
        </td></tr>`;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('clientTableBody');
      if (!data || !data.length) { 
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#64748b; padding:20px;">No clients found.</td></tr>`; 
        return; 
      }
      tbody.innerHTML = data.map(item => `
        <tr>
          <td><strong>#CL-${String(item.ClientID || item.id || 0).padStart(4, '0')}</strong></td>
          <td>${item.ClientName || item.clientName || item.name || 'Unnamed Client'}</td>
          <td>${item.Industry || item.industry || '<span style="color:#94a3b8;">N/A</span>'}</td>
        </tr>
      `).join('');
    }

    function filterTable() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      renderTable(list.filter(c => 
        (c.ClientName || c.clientName || '').toLowerCase().includes(q) || 
        (c.Industry || c.industry || '').toLowerCase().includes(q)
      ));
    }

    function openModal() { 
      document.getElementById('modal').style.display = 'flex'; 
      setTimeout(() => document.getElementById('nameInput').focus(), 50);
    }
    
    function closeModal() { 
      document.getElementById('modal').style.display = 'none'; 
      document.getElementById('addForm').reset();
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'modal') closeModal();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const clientName = document.getElementById('nameInput').value.trim();
      const industry = document.getElementById('industryInput').value.trim();

      try {
        const res = await fetch('/api/clients', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-user-id': getStoredUserId()
          },
          body: JSON.stringify({
            clientName: clientName,
            ClientName: clientName,
            industry: industry,
            Industry: industry
          })
        });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem("user");
          sessionStorage.removeItem("user");
          window.location.href = "index.html";
          return;
        }

        if (!res.ok) {
          const rawText = await res.text();
          let errData = {};
          try { errData = JSON.parse(rawText); } catch (e) {}
          throw new Error(errData.error || errData.message || 'Failed to add client.');
        }

        closeModal();
        await fetchClients();
      } catch (err) {
        alert(`Error: ${err.message}`);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
      }
    });
  </script>
</body>
</html>
